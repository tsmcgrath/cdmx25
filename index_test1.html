<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Condesa — Mapbox GL JS</title>

  <!-- Mapbox GL JS CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
  <script>
    // 1) Insert your Mapbox access token
    mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';

    // 2) Create the map
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-99.174, 19.4118], // Near La Condesa
      zoom: 14.5,
      hash: true
    });

    // 3) Controls
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.FullscreenControl(), 'top-right');
    map.addControl(new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }));

    // 4) Fit to an approximate bounding box for La Condesa
    const condesaBounds = new mapboxgl.LngLatBounds(
      [-99.1820, 19.4027], // SW corner (approx)
      [-99.1678, 19.4207]  // NE corner (approx)
    );
    map.fitBounds(condesaBounds, { padding: 40, duration: 0 });

    // 5) Optional marker near Parque México
    new mapboxgl.Marker()
      .setLngLat([-99.1713, 19.4118])
      .setPopup(new mapboxgl.Popup({ offset: 24 }).setText('La Condesa — Parque México'))
      .addTo(map);
  </script>
</body>
</html>
